[project]
name = "agent-skill-vet"
version = "0.1.0"
description = "Security scanner for AI agent SKILL.md files"
authors = [{ name = "wwb-bill" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-skill-vet = "agent_skill_vet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_skill_vet*"]
